name: ci
# Disabled to save build minutes: runs only when started manually from the Actions tab.
# Restore `push` and `pull_request` triggers to re-enable it.
on:
  workflow_dispatch:
jobs:
  fixtures:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            ~/.dylint_drivers/
            ~/.rustup/toolchains/
            target/
          key: dylint-${{ hashFiles('rust-toolchain.toml', '**/Cargo.toml') }}
      - run: cargo install cargo-dylint dylint-link --locked
      - run: cargo build --workspace
      - run: bash fixtures/run.sh
