[package]
name = "lint_support"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
publish.workspace = true
license.workspace = true
repository.workspace = true
readme = "../../README.md"
description = "Source-map and module-tree helpers shared by the Dylint libraries."
keywords = ["dylint", "lints", "clippy"]
categories = ["development-tools"]

# Links rustc_private crates without `rustc_driver`, so it has no test or doctest harness;
# behaviour is covered by the fixtures of the libraries using it.
[lib]
test = false
doctest = false

[package.metadata.rust-analyzer]
rustc_private = true

[dependencies]
ignored_paths.workspace = true

[lints]
workspace = true
